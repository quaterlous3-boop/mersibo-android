name: Build Mersibo Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Verify WebGL and Assets inside built APK
      run: |
        echo "=== Verifying APK internal contents ==="
        unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "VoxMain|unityweb|catalog|classes.dex"
        echo "=== APK verification successful ==="

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MersiboGames-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
